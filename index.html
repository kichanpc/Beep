<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>心靈樹洞 - 粵語錄音室</title>
  <style>
    * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; background-color: #f7f9fc;
    }
    .card {
      background: white; padding: 30px 20px; border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06); text-align: center; max-width: 360px; width: 90%;
    }
    .badge {
      display: inline-block; padding: 4px 12px; font-size: 11px; font-weight: 600;
      background: #ecfdf5; color: #065f46; border-radius: 12px; margin-bottom: 8px; border: 1px solid #a7f3d0;
    }
    .record-btn {
      width: 130px; height: 130px; border-radius: 50%; border: none;
      background: #9ca3af; color: white; font-size: 16px; font-weight: bold;
      cursor: not-allowed; margin: 20px auto; display: flex; align-items: center;
      justify-content: center; box-shadow: 0 6px 15px rgba(0,0,0,0.1); touch-action: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .record-btn.ready {
      background: linear-gradient(135deg, #10b981, #059669);
      cursor: pointer; box-shadow: 0 6px 15px rgba(16,185,129,0.3);
    }
    .record-btn.recording {
      background: linear-gradient(135deg, #ef4444, #f97316);
      transform: scale(1.08); box-shadow: 0 0 25px rgba(239, 68, 68, 0.5);
    }
    #status { margin: 10px 0; font-size: 13px; color: #4b5563; min-height: 20px; }
    #result-box {
      margin-top: 15px; padding: 12px 16px; background: #f1f4f8; border-radius: 12px;
      text-align: left; font-size: 14px; line-height: 1.5; min-height: 60px; word-break: break-word;
      user-select: text; -webkit-user-select: text;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🇭🇰 粵英混雜本地 Whisper-Base</div>
    <h2 style="margin:0 0 4px 0; color:#1f2937;">心靈樹洞</h2>
    <p style="margin:0; font-size:12px; color:#6b7280;">按住說話，放手放飛紙飛機 ✈️</p>
    
    <button id="recordBtn" class="record-btn" disabled>載入本機快取...</button>
    <div id="status">正在加載 Whisper 引擎...</div>

    <div id="result-box">
      <strong style="color:#374151;">本地脫敏後文字：</strong>
      <div id="resultText" style="color:#111827; margin-top:4px;">（暫無記錄）</div>
    </div>
  </div>

  <script>
    // ⚠️ 請替換為你實際的 Google Apps Script 部署 URL (以 /exec 結尾)
    const GAS_URL = "https://script.google.com/macros/s/你的SCRIPT_ID/exec";

    const btn = document.getElementById('recordBtn');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('resultText');

    let transcriber = null;
    let mediaStream = null;
    let audioChunks = [];
    let mediaRecorder = null;
    let isRecording = false;

    async function loadEngine() {
      try {
        statusText.innerText = "⏳ 載入本地神經引擎...";
        const { pipeline, env } = await import('https://esm.sh/@xenova/transformers@2.17.2');
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-base', {
          quantized: true
        });

        btn.disabled = false;
        btn.classList.add('ready');
        btn.innerText = "按住講嘢";
        statusText.innerText = "✅ 引擎就緒！隨時可開始說話";
      } catch (err) {
        statusText.style.color = "#dc2626";
        statusText.innerText = "❌ 引擎載入失敗: " + err.message;
      }
    }

    window.addEventListener('DOMContentLoaded', loadEngine);

    function sanitizeLocally(text) {
      let cleaned = text;
      cleaned = cleaned.replace(/(?:\+?853|\+?852)?[- ]?[689]\d{3}[- ]?\d{4}/g, '[聯絡電話]');
      cleaned = cleaned.replace(/\b\d{6,10}\b/g, '[校內編號]');
      cleaned = cleaned.replace(/(陳老師|張老師|李老師|王老師|校長|主任|miss\s*[a-z]+|mr\s*[a-z]+)/gi, '[教職員]');
      cleaned = cleaned.replace(/(培正|浸信|聖保祿|粵華|嘉諾撒|永援|澳大|科大)/g, '[校園環境]');
      return cleaned;
    }

    function playPaperPlaneSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const duration = 0.45;
        const buf = ctx.createBuffer(1, ctx.sampleRate * duration, ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < buf.length; i++) data[i] = Math.random() * 2 - 1;

        const noise = ctx.createBufferSource();
        noise.buffer = buf;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 3.0;
        filter.frequency.setValueAtTime(450, ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.12);
        filter.frequency.exponentialRampToValueAtTime(250, ctx.currentTime + duration);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.01, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.6, ctx.currentTime + 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
        noise.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    async function startRecord(e) {
      e.preventDefault();
      if (!transcriber || isRecording) return;

      audioChunks = [];
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({ 
          audio: { channelCount: 1, sampleRate: 16000 } 
        });

        mediaRecorder = new MediaRecorder(mediaStream);
        mediaRecorder.ondataavailable = (evt) => {
          if (evt.data.size > 0) audioChunks.push(evt.data);
        };

        mediaRecorder.start();
        isRecording = true;
        btn.classList.add('recording');
        btn.innerText = "放手起飛 ✈️";
        statusText.innerText = "🎙️ 正在傾聽中 (廣東話/English)...";
      } catch (err) {
        statusText.innerText = "❌ 麥克風異常：" + err.message;
      }
    }

    async function stopRecord(e) {
      e.preventDefault();
      if (!isRecording || !mediaRecorder) return;

      playPaperPlaneSound();
      isRecording = false;
      btn.classList.remove('recording');
      btn.innerText = "按住講嘢";
      statusText.innerText = "✈️ 心事已起飛，本地轉錄中...";

      mediaRecorder.onstop = async () => {
        mediaStream.getTracks().forEach(t => t.stop());

        const audioBlob = new Blob(audioChunks);
        const arrayBuffer = await audioBlob.arrayBuffer();
        
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const tempCtx = new AudioCtx({ sampleRate: 16000 });
        const decoded = await tempCtx.decodeAudioData(arrayBuffer);
        const pcmData = decoded.getChannelData(0);
        const durationSec = Math.round(decoded.duration);

        setTimeout(async () => {
          try {
            const result = await transcriber(pcmData, {
              language: 'chinese',
              task: 'transcribe',
              prompt: '以下係一段學生日常廣東話校園分享，包含常見英文：presentation, quiz, project, exam, deadline, 唔該, 真係好攰, 好煩, 溫習。請用香港繁體粵語口語輸出。'
            });

            const rawText = (result.text || "").trim();
            const sanitized = sanitizeLocally(rawText);

            resultText.innerText = sanitized || "（未識別到清晰內容）";
            statusText.innerText = "✈️ 本地脫敏完成，正寫入 Google Sheets...";

            // 使用 fetch POST 直接發送到 GAS
            fetch(GAS_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ text: sanitized, duration: durationSec })
            })
            .then(res => res.json())
            .then(data => {
              if (data.status === 'success') {
                statusText.innerText = "✅ 成功存入 Google Sheets（音訊純本地解碼）！";
              } else {
                statusText.innerText = "❌ 存檔失敗: " + data.message;
              }
            })
            .catch(err => {
              statusText.innerText = "❌ 網絡傳輸異常: " + err.message;
            });

          } catch (inferErr) {
            statusText.innerText = "❌ 轉錄異常：" + inferErr.message;
          }
        }, 50);
      };

      mediaRecorder.stop();
    }

    btn.addEventListener('touchstart', startRecord, { passive: false });
    btn.addEventListener('touchend', stopRecord, { passive: false });
    btn.addEventListener('mousedown', startRecord);
    window.addEventListener('mouseup', () => { if (isRecording) stopRecord(new Event('mouseup')); });
  </script>
</body>
</html>
